name: snap
on:
  push:
    tags:
      - 'jazzy/*'
    branches:
      - jazzy
    paths-ignore:
      - .github/worflows/promote.yaml
      - README.md
      - .gitignore
  pull_request:
    branches:
      - jazzy
    paths-ignore:
      - .github/worflows/promote.yaml
      - README.md
      - .gitignore
  workflow_dispatch:
  workflow_call:
    inputs:
      git-ref:
        required: false
        type: string
        default: ${{ github.ref }}

jobs:
  snap:
    uses: canonical/robotics-actions-workflows/.github/workflows/snap.yaml@main
    secrets:
      snapstore-login: ${{ secrets.STORE_LOGIN }}
    with:
      git-ref: ${{ inputs.git-ref }}
      runs-on: '["ubuntu-latest", "ubuntu-latest-arm"]'
      snapcraft-enable-experimental-extensions: true
      snap-track: jazzy
      snap-risk: candidate
      snap-test-script: |
        #!/bin/bash

        ros2-cli.ros2 --help
